compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
num_processes: 2
num_machines: 1
machine_rank: 0
mixed_precision: bf16  # H200 支持 bfloat16，速度更快，精度更稳

deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_clipping: 1.0
  zero_stage: 3  # ★ 关键：必须 Stage 3，才能节省模型权重显存
  zero_optimization:
    stage: 3
    offload_optimizer:
      device: cpu  # Optimizer states offload to CPU
      pin_memory: true
    offload_param:
      device: cpu  # Model parameters offload to CPU
      pin_memory: true
    overlap_comm: true  # 加速通信
    contiguous_gradients: true
    reduce_bucket_size: 500000000  # 调整 bucket，减少显存波动
    prefetch_bucket_size: 50000000
    param_persistence_threshold: 1000000
  train_micro_batch_size_per_gpu: 64  # 这里只是记录，实际以你的训练命令为准
  gradient_accumulation_steps: 4  # 这里只是记录，实际以你的训练命令为准
